# Multus NetworkAttachmentDefinition for the tagged workload VLAN 150.
# "network" picks the productised Network resource (calico-l2); "vlan" picks
# the spec.vlans entry (150). IPAM is plain calico-ipam -- the Network's
# per-VLAN subnet filters the pool automatically.
apiVersion: 'k8s.cni.cncf.io/v1'
kind: NetworkAttachmentDefinition
metadata:
  name: vm-vlan-150
  namespace: virtual-machines
spec:
  config: |
   {
    "name": "vm-vlan-150",
    "cniVersion": "0.3.1",
    "plugins": [
    {
      "type": "calico",
      "container_settings": {
        "allow_ip_forwarding": false
      },
      "datastore_type": "kubernetes",
      "endpoint_status_dir": "/var/run/calico/endpoint-status",
      "ipam": {
        "assign_ipv4": "true",
        "assign_ipv6": "false",
        "type": "calico-ipam"
      },
      "kubernetes": {
        "k8s_api_root": "https://10.43.0.1:443",
        "kubeconfig": "/etc/cni/net.d/calico-kubeconfig"
      },
      "log_file_max_age": 30,
      "log_file_max_count": 10,
      "log_file_max_size": 100,
      "log_file_path": "/var/log/calico/cni/cni-vlan150.log",
      "log_level": "Info",
      "mtu": 1500,
      "nodename_file_optional": false,
      "policy": {
        "type": "k8s"
      },
      "policy_setup_timeout_seconds": 0,

      "network": "calico-l2",
      "vlan": 150
    }
   ]}
